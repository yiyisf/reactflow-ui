name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for npm OIDC trusted publishing & provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (npm v11.5.1+ required for Trusted Publishing OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --allow-remote

      - name: Build
        run: npm run build

      - name: Sync version from release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          echo "Publishing version $(node -p "require('./package.json').version")"

      - name: Publish to npm (via OIDC Trusted Publishing)
        run: npm publish --provenance --access public

