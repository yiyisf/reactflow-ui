name: Visual baselines

# Regenerates tests/visual/__screenshots__ inside the same Playwright image the check uses, and commits them to the
# branch. Use it once to create the first baselines, and whenever a visual change is intended:
#   - on a pull request: add the label "update-visual-baselines" (works before this file reaches the default branch).
#     The label is a one-shot command: the workflow removes it when done, so add it again for the next regeneration.
#   - on any branch: run it manually from the Actions tab (workflow_dispatch)
# Review the committed images in the PR diff before merging, then re-run the "Visual regression" check.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

env:
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-visual-baselines'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm i --no-save @playwright/test@${PLAYWRIGHT_VERSION}

      # =all rewrites every baseline; the default (changed) skips diffs under maxDiffPixelRatio,
      # so small icon fixes would never land in the baselines.
      - name: Regenerate baselines
        run: npx playwright test --update-snapshots=all

      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(visual): update screenshot baselines"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Remove the trigger label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-visual-baselines" \
            -o /dev/null -w "label removal: HTTP %{http_code}\n"
