<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11172B" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="branch-top" x1="9" y1="16" x2="23" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="branch-bottom" x1="9" y1="16" x2="23" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Minimalist Squircle Base -->
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="8" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Bifurcated DAG Flow Curves -->
  <path d="M 9.5 16 C 15 16, 15.5 10, 22.5 10" stroke="url(#branch-top)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M 9.5 16 C 15 16, 15.5 22, 22.5 22" stroke="url(#branch-bottom)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Origin Root Node -->
  <circle cx="9.5" cy="16" r="3.4" fill="#6366F1" />
  <circle cx="9.5" cy="16" r="1.4" fill="#F8FAFC" />

  <!-- Upper Branch Target Node -->
  <circle cx="22.5" cy="10" r="2.7" fill="#22D3EE" />

  <!-- Lower Branch Deterministic Pass Node -->
  <circle cx="22.5" cy="22" r="2.7" fill="#34D399" />
</svg>
