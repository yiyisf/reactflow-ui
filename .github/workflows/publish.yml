name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for npm OIDC trusted publishing & provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # 注意：配置 Trusted Publishing (OIDC) 时不要传 registry-url，
          # 否则 setup-node 会注入传统静态 token 配置覆盖 OIDC 凭证

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync version from release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing version $VERSION"

      - name: Publish to npm (via OIDC Trusted Publishing)
        run: npm publish --provenance --access public

