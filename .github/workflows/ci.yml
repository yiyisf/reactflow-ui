name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 全量类型检查（含测试与演示代码；构建只检查入口可达的文件）。
      # 先以非阻塞方式上线，存量问题清理后去掉 continue-on-error。
      - name: Typecheck (all sources)
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
